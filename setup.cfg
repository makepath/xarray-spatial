[metadata]
author = Xarray-Spatial Developers
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
description = xarray-based spatial analysis tools
license = MIT
license_file = LICENSE.txt
long_description = file: README.md
long_description_content_type = text/markdown
name = xarray-spatial
platforms = any
url = https://github.com/xarray-contrib/xarray-spatial

[options]
include_package_data = True
# Every bound below is checked by the min-deps job in
# .github/workflows/test.yml, which installs exactly these versions and
# runs the suite against them. Issue #3701 has the full derivation.
#
#   numba, scipy      oldest release shipping a CPython 3.12 wheel, which
#                     is the floor python_requires allows anyway
#   numpy >=1.26      first cp312 wheel, and xarray's own numpy floor
#   numpy <2.5        mirrors numba: 0.64-0.66 declare numpy<2.5 and numba
#                     re-checks it at import in _ensure_critical_deps.
#                     Without this, pip installs a numpy that makes
#                     `import xrspatial` raise ImportError. Re-check this
#                     on every numba bump -- nothing flags a stale cap,
#                     and leaving it behind blocks a numpy that works.
#   xarray >=2025.11  earlier releases drop attrs across DataArray binary
#                     ops, so morph_gradient / morph_white_tophat /
#                     morph_black_tophat and the mcda and corridor
#                     metadata tests lose res and crs
#   pandas >=2.2      required by xarray >=2025.11; pandas is a direct
#                     import here (zonal, dasymetric, focal) and part of
#                     the public API -- zonal_stats returns a DataFrame
#   urllib3 >=2.7     first release with no open advisory against the
#                     streaming read path used by the COG-over-HTTP source
install_requires =
    numba >=0.59
    scipy >=1.11.2
    xarray >=2025.11
    numpy >=1.26,<2.5
    pandas >=2.2
    urllib3 >=2.7
packages = find:
python_requires = >=3.12
setup_requires = setuptools_scm
zip_safe = False

[options.entry_points]
console_scripts =
    xrspatial = xrspatial.__main__:main
xarray.backends =
    xrspatial = xrspatial.geotiff._xarray_backend:GeoTIFFBackendEntrypoint

[options.extras_require]
doc =
    dask[dataframe]
    geopandas
    Jinja2 >=2.11
    ipykernel
    matplotlib
    myst-parser
    nbsphinx
    numpydoc
    pandoc
    pydata_sphinx_theme
    sphinx
    sphinx-panels
    sphinx_rtd_theme
examples =
    # Rendering (matplotlib) and vector rasterization (geopandas / shapely)
    # for the example notebooks. datashader is no longer required.
    matplotlib
    geopandas
    shapely
plot =
    # Optional for the .xrs.plot accessor helpers. Every matplotlib
    # import in the package is lazy, so the compute functions work
    # without this extra installed.
    matplotlib
vector =
    # Optional for the vector-to-raster paths (rasterize, polygonize).
    # shapely is imported lazily so `import xrspatial` does not load it.
    shapely>=2.0
optional =
    # Optional for polygonize return types.
    awkward>=1.4
    geopandas
    spatialpandas
    # Optional for gpu_rtx functions. Also requires cupy.
    rtxpy
reproject =
    pyproj
geotiff =
    deflate
    # Required by the GeoTIFF writer to classify EPSG codes as
    # geographic vs projected. Without pyproj the writer can only
    # handle a tiny hard-coded allowlist of EPSGs and raises
    # UnknownCRSModelTypeError on anything else. See issue #2277.
    pyproj
    # ZSTD codec for the TIFF reader and writer. The import is already
    # guarded (ZSTD_AVAILABLE in xrspatial/geotiff/_compression.py), and
    # zstd_compress / zstd_decompress raise a pip-install hint when it is
    # missing, so this belongs beside the other codec extras rather than
    # in install_requires. See issue #3701.
    zstandard >=0.22
dask =
    dask[array]
    dask-geopandas
gpu =
    # The `cupy` project on PyPI is sdist-only at every version, so naming it
    # here makes `pip install xarray-spatial[gpu]` compile CuPy from source
    # and fail without a full nvcc toolchain. The prebuilt wheels are
    # published per CUDA major version, so the extra has to pick one:
    # `gpu` targets CUDA 12, `gpu-cuda13` targets CUDA 13. Conda users can
    # keep installing plain `cupy` from conda-forge and skip both extras.
    #
    # Floor: python_requires is >=3.12 and cupy-cuda12x 12.3.0 is the first
    # release with cp312 wheels (12.0.0 stops at cp311). See issue #3699.
    #
    # cuspatial is deliberately absent. The `cuspatial` project on PyPI is a
    # 2020 name-holder whose install raises, real cuSpatial is conda/RAPIDS
    # only (or `cuspatial-cu12`), and nothing in xrspatial imports it.
    cupy-cuda12x >=12.3
gpu-cuda13 =
    # CUDA 13 build of the `gpu` extra. cupy-cuda13x first appeared at 13.6.0.
    cupy-cuda13x >=13.6
tests =
    flake8
    geopandas
    hypothesis
    isort
    matplotlib
    noise >= 1.2.2
    dask
    # Used by the setup.cfg metadata guards in
    # xrspatial/tests/test_dependency_metadata_3701.py. It reaches the
    # environment through xarray anyway, but this file is the wrong place
    # to lean on a transitive dependency.
    packaging
    pyarrow
    pyproj
    pytest
    pytest-cov
    scipy
    shapely>=2.0
    # Keeps the ZSTD codec tests running now that zstandard moved out of
    # install_requires; without it they silently skip.
    zstandard >=0.22


[flake8]
exclude =
    .git,
    .asv,
    __pycache__,
max-line-length = 100

[tool:pytest]
filterwarnings =
    ignore::numba.core.errors.NumbaPerformanceWarning
    ignore::numba.core.errors.NumbaPendingDeprecationWarning
    ignore:You will likely lose important projection information:UserWarning:pyproj
    ignore:cost_distance. max_cost is infinite:UserWarning:xrspatial
    ignore:surface_distance. max_distance is infinite:UserWarning:xrspatial
    ignore:proximity. target coordinates exceed:ResourceWarning:xrspatial
    ignore:viewshed. grid exceeds memory:UserWarning:xrspatial
    ignore:Covariance of the parameters could not be estimated:scipy.optimize.OptimizeWarning
    ignore:'oneOf' deprecated:DeprecationWarning:matplotlib
    ignore:'parseString' deprecated:DeprecationWarning:matplotlib
    ignore:'resetCache' deprecated:DeprecationWarning:matplotlib
    ignore:'enablePackrat' deprecated:DeprecationWarning:matplotlib
    ignore:'asyncio.AbstractEventLoopPolicy' is deprecated:DeprecationWarning:pytest_asyncio
markers =
    slow: long-running test cell (typical: golden-corpus fixtures behind a heavy codec or large pixel count). PR CI can skip with `-m "not slow"`; nightly / release runs use no filter. See xrspatial/geotiff/tests/golden_corpus/_marks.py for the corpus-side helper.
    release_gate: locks a single stable feature in the GeoTIFF release contract (epic #2340). Always runs by default in CI; the marker exists so release engineers can run only these gates with `pytest -m release_gate` before tagging a release. Tests in this marker should be small, deterministic, and fail loudly if the contract breaks.

[isort]
line_length = 100
